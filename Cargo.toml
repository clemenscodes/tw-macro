[workspace]
resolver = "2"
members = ["crates/tw-macro"]

[workspace.package]
authors = ["clemenscodes"]
edition = "2024"
license = "MIT"
version = "0.3.0"

[workspace.dependencies]
dioxus = { version = "=0.7.10" }

[profile.release]
codegen-units = 16
opt-level = 3
lto = false
panic = 'unwind'
strip = "symbols"
